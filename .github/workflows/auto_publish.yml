name: Auto Publish YouTube & Instagram

on:
  schedule:
    - cron: '0 4,7,11,14 * * *'   # 9:30 AM, 12:30 PM, 4:30 PM, 8:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-yt-ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg & Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow numpy requests google-api-python-client google-auth-oauthlib

      - name: Generate & Publish Reel to YouTube + Instagram
        env:
          YT_CLIENT_SECRETS: ${{ secrets.YT_CLIENT_SECRETS }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python cloud_pipeline.py

      - name: Save quote history so quotes never repeat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add schedule_state.json
          git diff --staged --quiet || git commit -m "Update posted quote history"
          git push
